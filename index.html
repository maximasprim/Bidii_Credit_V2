<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/Main_Favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2A4A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1A2E" media="(prefers-color-scheme: dark)" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bidii-theme");
          var isDark = stored === "dark" || (!stored && matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO -->
    <title>Bidii Credit Kenya | SME, Business, Logbook & CheckOff Loans</title>
    <meta
      name="description"
      content="Bidii Credit Limited, licensed by the Central Bank of Kenya, offers fast SME, logbook, mobile, check-off and rental income loans across Kenya."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Bidii Credit Limited" />
    <link rel="canonical" href="https://www.bidiicreditkenya.co.ke/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Bidii Credit Kenya" />
    <meta property="og:title" content="Bidii Credit | Financing for Kenyan Businesses" />
    <meta
      property="og:description"
      content="Licensed, transparent lending for SMEs, entrepreneurs and salaried Kenyans. Apply in minutes, know your repayment before you borrow."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bidiicreditkenya.co.ke/" />
    <meta property="og:locale" content="en_KE" />
    <!-- replace with a real 1200x630 social share image hosted on the domain -->
    <meta property="og:image" content="https://www.bidiicreditkenya.co.ke/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bidii Credit Kenya - business and salary loans" />

    <meta name="twitter:title" content="Bidii Credit | Financing for Kenyan Businesses" />

      name="twitter:description"
      content="Licensed, transparent lending for SMEs, entrepreneurs and salaried Kenyans. Apply in minutes, know your repayment before you borrow."
    />
    <meta name="twitter:image" content="https://www.bidiicreditkenya.co.ke/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />

          "@type": "PostalAddress",

        },
